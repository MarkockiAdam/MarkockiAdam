name: update profile art

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose -- GitHub drops scheduled runs
    # that pile up on the exact hour.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/fetch_profile_stats.py"
      - "scripts/render_heatmap_svg.py"
      - "scripts/make_info_card.py"
      - "scripts/theme.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-ci.txt

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py "${{ github.repository_owner }}"

      - name: Fetch profile stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_profile_stats.py "${{ github.repository_owner }}"

      # Both renderers are pure text work -- no Pillow, no numpy, no model
      # download. The portrait is a committed artefact and is left alone,
      # since regenerating it would need the whole image toolchain.
      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render info card
        run: python scripts/make_info_card.py

      - name: Commit if anything changed
        run: |
          # Only the SVGs are checked: the JSON files carry a generated_at
          # stamp that changes every run, which would mean a commit a day
          # even when nothing actually moved.
          if git diff --quiet -- contrib-heatmap.svg info-card.svg; then
            echo "no change"
            exit 0
          fi
          # Commit as the repo owner so github-actions[bot] never appears
          # on the contributors graph.
          git config user.name "Adam"
          git config user.email "97188913+MarkockiAdam@users.noreply.github.com"
          git add contrib-heatmap.svg info-card.svg data/contributions.json data/profile-stats.json
          git commit -m "chore: refresh contribution graph and info card"
          git push
